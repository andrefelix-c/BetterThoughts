name: Trigger & Check-in Notifications Cron

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  dispatch-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Call BetterThoughts notifications cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets APP_URL e/ou CRON_SECRET não configurados no GitHub. Pulando execução."
            exit 0
          fi

          CLEAN_URL=$(printf '%s' "$APP_URL" | tr -d '[:space:]')
          case "$CLEAN_URL" in
            http://*|https://*) ;;
            *) CLEAN_URL="https://$CLEAN_URL" ;;
          esac

          # Garante apenas esquema + domínio (caso APP_URL tenha sido salvo com caminho extra)
          ORIGIN=$(printf '%s' "$CLEAN_URL" | sed -E 's#(https?://[^/]+).*#\1#')

          STATUS=$(curl -sS --connect-timeout 15 --max-time 60 -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${ORIGIN}/api/cron/notifications")

          echo "HTTP Status: $STATUS"
          cat response.json || true
          echo ""
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Falha HTTP $STATUS"
            exit 1
          fi
