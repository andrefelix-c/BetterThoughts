name: Trigger & Check-in Notifications Cron

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  dispatch-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Call BetterThoughts notifications cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets APP_URL e/ou CRON_SECRET não configurados no GitHub. Pulando execução."
            exit 0
          fi

          STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/notifications")

          cat response.json
          echo ""
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Falha HTTP $STATUS"
            exit 1
          fi

